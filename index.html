  <div id="preloader" role="status" aria-label="Memuat"><canvas></canvas></div>
  <script>
    // Preloader: matahari di tengah layar, dua titik mengorbit (satu untuk
    // setiap huruf "i" di nama). Setelah Flutter siap, adegan yang sama
    // dilanjutkan oleh lib/widgets/intro.dart, jadi semua angka di sini HARUS
    // sama dengan intro.dart, sun.dart, dan warna aksen (#629CEF).
    (function () {
      var el = document.getElementById('preloader');
      var canvas = el.querySelector('canvas');
      var ctx = canvas.getContext('2d');
      var t0 = performance.now();
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var CORE = 14, DOT = 4;
      var ORBITS = [
        { r: 52, period: 3, phase: -Math.PI / 2 },
        { r: 84, period: 6, phase: Math.PI * 0.7 },
      ];
      var raf = 0, w = 0, h = 0, dpr = 1;

      function elapsed() { return reduced ? 0 : (performance.now() - t0) / 1000; }

      function circle(x, y, r) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }

      // Sama seperti _SunPainter._glow
      function glow(x, y, r, a) {
        var g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(158,197,255,' + a + ')');
        g.addColorStop(0.35, 'rgba(158,197,255,' + a * 0.35 + ')');
        g.addColorStop(1, 'rgba(158,197,255,0)');
        ctx.fillStyle = g;
        circle(x, y, r);
      }

      function draw() {
        var t = elapsed();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        var cx = w / 2, cy = h / 2, r = CORE;

        var breathe = 1 + 0.06 * Math.sin(2 * Math.PI * t / 6);
        glow(cx, cy, r * 9.5 * breathe, 0.10);
        glow(cx, cy, r * 4.0 * breathe, 0.28);
        glow(cx, cy, r * 1.9, 0.55);
        ctx.filter = 'blur(' + r * 0.18 + 'px)';
        ctx.fillStyle = '#F2F7FF';
        circle(cx, cy, r);

        ORBITS.forEach(function (o) {
          ctx.filter = 'none';
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(237,239,247,0.12)';
          ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.stroke();

          var a = o.phase + 2 * Math.PI * t / o.period;
          var x = cx + Math.cos(a) * o.r, y = cy + Math.sin(a) * o.r;
          ctx.filter = 'blur(' + DOT * 1.4 + 'px)';
          ctx.fillStyle = 'rgba(98,156,239,0.4)';
          circle(x, y, DOT * 1.5);
          ctx.filter = 'none';
          ctx.fillStyle = '#629CEF';
          circle(x, y, DOT);
        });

        if (!reduced) raf = requestAnimationFrame(draw);
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = innerWidth; h = innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        if (reduced) draw();
      }

      window.__preloader = {
        elapsed: elapsed,
        hide: function () {
          if (!el.isConnected || el.classList.contains('done')) return;
          el.classList.add('done');
          setTimeout(function () { cancelAnimationFrame(raf); el.remove(); }, 250);
        },
      };

      addEventListener('resize', resize);
      resize();
      if (!reduced) draw();
    })();
  </script>
